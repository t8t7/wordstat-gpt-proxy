name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Validate Compose configuration
        env:
          WORDSTAT_ENV_FILE: .env.example
        run: docker compose config --quiet

      - name: Build container
        run: docker build --tag wordstat-gpt-proxy:test .

