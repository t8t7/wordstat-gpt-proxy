services:
  wordstat-api:
    build:
      context: .
    restart: unless-stopped
    environment:
      PROXY_API_KEY: ${PROXY_API_KEY:?Set PROXY_API_KEY in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      WORDSTAT_TIMEOUT_SECONDS: ${WORDSTAT_TIMEOUT_SECONDS:-30}
      WORDSTAT_NUM_PHRASES: ${WORDSTAT_NUM_PHRASES:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8000"
      - "127.0.0.1:7901:7900"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    shm_size: 256mb
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - wordstat-browser-profile:/var/lib/wordstat-browser
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wordstat-internal

  redis:
    image: redis:7.4.5-alpine
    user: "999:1000"
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /data:size=32m,mode=0700,uid=999,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wordstat-internal

networks:
  wordstat-internal:
    driver: bridge

volumes:
  wordstat-browser-profile:
