services:
  wordstat-api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${WORDSTAT_ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wordstat-internal

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /data:size=32m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wordstat-internal

networks:
  wordstat-internal:
    driver: bridge
